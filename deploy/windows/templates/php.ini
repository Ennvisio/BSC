; NaviSuite vessel server: PHP 8.3 (thread-safe, x64).
; Generated by deploy/windows/install-server.ps1 from
; deploy/windows/templates/php.ini. Used by Apache (PHPIniDir) and by the
; queue, scheduler and artisan commands (PHPRC).

[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zend.enable_gc = On
expose_php = Off

max_execution_time = 120
max_input_time = 60
max_input_vars = 5000
memory_limit = 512M

error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "{{ROOT}}\data\logs\php\php-errors.log"

file_uploads = On
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 20
upload_tmp_dir = "{{ROOT}}\data\tmp"
sys_temp_dir = "{{ROOT}}\data\tmp"

allow_url_fopen = On
allow_url_include = Off
default_charset = "UTF-8"
enable_dl = Off

realpath_cache_size = 4096k
realpath_cache_ttl = 600

extension_dir = "{{ROOT}}\runtime\php\ext"
; ctype, dom, tokenizer, xml, iconv and pdo are built into the Windows build.
extension=curl
extension=fileinfo
extension=gd
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=zip
; Checkpoint 7: the application opens its credentials with Windows DPAPI
; through FFI (App\Support\Secrets\DpapiProtector). "true" because Apache
; is not the CLI and Windows has no opcache preloading.
extension=ffi
extension=sodium
ffi.enable = true
zend_extension=opcache

[Date]
date.timezone = Asia/Dhaka

[Session]
; Laravel keeps its own sessions; these only harden PHP's defaults.
session.use_strict_mode = 1
session.cookie_httponly = 1

[mail function]
; No mail is sent on board (MAIL_DRIVER=log).

[curl]
; Mozilla CA bundle, used to check the cloud's HTTPS certificate when
; NaviSuite-Sync connects. Commented out (;) while config\php\cacert.pem
; is missing; install-server.ps1 copies it from the runtime folder.
{{CA_BUNDLE_OFF}}curl.cainfo = "{{ROOT}}\config\php\cacert.pem"

[openssl]
{{CA_BUNDLE_OFF}}openssl.cafile = "{{ROOT}}\config\php\cacert.pem"

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Updates replace the files, so keep checking timestamps.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
