# NaviSuite vessel server: MySQL 8.0 or 8.4 (Community, Windows x64 ZIP).
# Generated by deploy/windows/install-server.ps1 from
# deploy/windows/templates/my.ini.

[mysqld]
basedir="{{ROOT_FWD}}/runtime/mysql"
datadir="{{ROOT_FWD}}/data/mysql"
tmpdir="{{ROOT_FWD}}/data/tmp/mysql"
log-error="{{ROOT_FWD}}/data/logs/mysql/mysqld.err"
port=3306

# Only this PC can reach MySQL. Client PCs talk to Apache, never to MySQL,
# and the firewall blocks 3306 and 33060 as a second line of defence.
bind-address=127.0.0.1
mysqlx=OFF
named_pipe=OFF
shared_memory=OFF

# No file import or export from SQL.
local_infile=0
secure_file_priv=NULL

character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
# Same offset as the application (Asia/Dhaka, no daylight saving), so
# NOW() and CURRENT_TIMESTAMP agree with Laravel's timestamps.
default-time-zone='+06:00'

# Sync capture triggers are created by the application's own database user.
# With binary logging on, MySQL requires this setting for that.
log_bin_trust_function_creators=1
# Binary log kept for 7 days: lets a backup be rolled forward after a fault.
binlog_expire_logs_seconds=604800

# Durable writes. Ships lose power; a committed requisition must survive.
innodb_flush_log_at_trx_commit=1
sync_binlog=1

innodb_buffer_pool_size={{INNODB_BUFFER_POOL_MB}}M
max_connections=100
max_allowed_packet=64M

[client]
port=3306
host=127.0.0.1
default-character-set=utf8mb4
