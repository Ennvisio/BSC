# NaviSuite vessel server: Apache HTTP Server 2.4 (Apache Lounge, x64).
# Generated by deploy/windows/install-server.ps1 from
# deploy/windows/templates/httpd.conf. Edit the template, not this file:
# the install and update scripts write this file again.

Define NS_ROOT "{{ROOT_FWD}}"

ServerRoot "${NS_ROOT}/runtime/apache"
PidFile "${NS_ROOT}/data/logs/apache/httpd.pid"

Listen 80
Listen 443

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule alias_module modules/mod_alias.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule dir_module modules/mod_dir.so
LoadModule filter_module modules/mod_filter.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so

# PHP 8.3 thread-safe x64 build, running inside Apache.
LoadModule php_module "${NS_ROOT}/runtime/php/php8apache2_4.dll"
PHPIniDir "${NS_ROOT}/config/php"

ServerName {{SERVER_NAME}}
ServerAdmin admin@{{SERVER_NAME}}

# Say as little as possible about the server.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag MTime Size

# Windows threading model (mpm_winnt). One process, many threads.
ThreadsPerChild 64
MaxConnectionsPerChild 0
AcceptFilter http none
AcceptFilter https none

Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500

# Uploads: PHP allows 20 MB per file and 25 MB per request (php.ini).
LimitRequestBody 26214400

TypesConfig conf/mime.types
AddType application/x-x509-ca-cert .crt
AddDefaultCharset UTF-8

ErrorLog "|bin/rotatelogs.exe -n 5 ${NS_ROOT}/data/logs/apache/error.log 10M"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b %D \"%{Referer}i\" \"%{User-Agent}i\"" navisuite
CustomLog "|bin/rotatelogs.exe -n 5 ${NS_ROOT}/data/logs/apache/access.log 10M" navisuite

# Nothing on disk is served unless allowed below.
<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "${NS_ROOT}/app"
<Directory "${NS_ROOT}/app">
    # FollowSymLinks: the upload folders are junctions into data\.
    Options FollowSymLinks
    # The repository's .htaccess files are written for the cloud host and
    # are ignored here. Everything they did is in this file.
    AllowOverride None
    Require all granted
</Directory>

# Uploaded files are never executed, whatever their name. Apache sees them
# both through the junctions in app\ and at their real place in data\.
<DirectoryMatch "(?i)^${NS_ROOT}/app/(storage|images/(cert_copy|signature|userphoto))">
    php_admin_flag engine off
    RemoveHandler .php .phtml .phar
</DirectoryMatch>
<Directory "${NS_ROOT}/data">
    Options None
    AllowOverride None
    php_admin_flag engine off
    RemoveHandler .php .phtml .phar
    Require all granted
</Directory>

# The vessel's certificate authority, so a client PC can trust this server:
#   http://<server>/navisuite-ca.crt
# Only the public certificate is in this folder's allow-list. The keys are
# elsewhere and the folder itself is denied.
Alias "/navisuite-ca.crt" "${NS_ROOT}/config/certs/ca.crt"
<Directory "${NS_ROOT}/config/certs">
    Options None
    AllowOverride None
    Require all denied
    <Files "ca.crt">
        Require all granted
    </Files>
</Directory>

<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex index.php


# Plain HTTP: /health and the CA certificate are answered directly, so a
# client can discover the server and set up trust before using HTTPS.
# Everything else is redirected to HTTPS.
<VirtualHost *:80>
    ServerName {{SERVER_NAME}}
    RewriteEngine On
    RewriteRule "^/navisuite-ca\.crt$" - [L]
    RewriteRule "^/health$" "/index.php" [L]
    RewriteCond "%{HTTP_HOST}" "^(.+?)(:\d+)?$"
    RewriteRule "^" "https://%1%{REQUEST_URI}" [R=301,L]
    RewriteRule "^" "-" [R=400,L]
</VirtualHost>

# HTTPS, with the certificate issued by this vessel's own authority.
SSLRandomSeed startup builtin
SSLRandomSeed connect builtin
SSLSessionCache "shmcb:${NS_ROOT}/data/logs/apache/ssl_scache(512000)"
SSLSessionCacheTimeout 300
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
SSLHonorCipherOrder off
SSLSessionTickets off

<VirtualHost *:443>
    ServerName {{SERVER_NAME}}
    SSLEngine on
    SSLCertificateFile "${NS_ROOT}/config/certs/server.crt"
    SSLCertificateKeyFile "${NS_ROOT}/config/certs/server.key"

    # The application lives in the web root (bootstrap/app.php sets the
    # public path to the project root). So instead of serving any file that
    # exists, as the cloud's .htaccess does, only real files inside the asset
    # folders are served. Every other request, including /.env, /storage/...,
    # /vendor/..., /composer.json and the SQL dumps, goes to Laravel, which
    # answers 404. Script files are never served from the asset folders.
    RewriteEngine On
    RewriteRule "^/navisuite-ca\.crt$" - [L]
    RewriteCond "%{REQUEST_URI}" "^/(css|js|images|assets|svg)/" [OR]
    RewriteCond "%{REQUEST_URI}" "^/(favicon\.ico|robots\.txt)$"
    RewriteCond "%{REQUEST_URI}" "!\.(php|phtml|phar|htaccess|ini|log|sql|env)$" [NC]
    RewriteCond "%{DOCUMENT_ROOT}%{REQUEST_URI}" -f
    RewriteRule "^" - [L]
    RewriteRule "^" "/index.php" [L]

    # No HSTS: the certificate is private to the ship, and HSTS would lock
    # browsers out completely if it ever had to be replaced in a hurry.
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    Header always unset X-Powered-By

    <LocationMatch "^/(css|js|images|assets|svg)/">
        Header set Cache-Control "public, max-age=3600"
    </LocationMatch>

    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml
</VirtualHost>
