; NaviSuite-Server-Setup.exe /S /ANSWERS=<this file>
;
; Settings for a NEW vessel server. On a server that is already installed
; only the [sync] section is used (to connect a server that was installed
; before the vessel was registered); everything else is kept as it is.
; Lines starting with ; are ignored.

[server]
; Required: this vessel's id in the office database (vessels.id).
VesselId=12
; The name crew PCs use for the server. Empty: this PC's name in lower case.
; Letters, digits and hyphens.
ServerName=
; More names or addresses for the HTTPS certificate, comma-separated.
ExtraNames=
; 1: open the firewall for the LAN (recommended). 0: leave it to IT.
Firewall=1
; Who may connect: LocalSubnet, or address ranges, comma-separated.
FirewallRemoteAddress=LocalSubnet
; MySQL memory in MB (512 suits a PC with 8 GB).
InnoDbBufferPoolMB=512

[sync]
; The office (cloud) address, node id and token from
; "php artisan sync:register-node vessel --vessel=<id>" on the cloud.
; All three can be left empty and added later.
CloudUrl=
NodeId=
; Put the token in a separate file and name it here, then delete that file
; after the installation. (Token= also works, but then delete this file.)
TokenFile=
